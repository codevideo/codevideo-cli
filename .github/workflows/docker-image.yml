name: Docker image

# Build the render-worker image and run real renders in it: serve-mode jobs the
# way the API queues them, and CLI-mode renders whose output is checked the way
# a user sees it. On main that's all. On the same v* tags as the npm release
# (kept in a separate workflow so a registry hiccup doesn't block the npm
# publish, and vice versa) the image is then pushed to Docker Hub. Manual runs
# publish an existing release tag using the current workflow, allowing recovery
# without moving release tags.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing committed release tag to publish (never a branch)
        required: true
        default: v0.0.12
        type: string

concurrency:
  group: docker-image-${{ inputs.release_tag || github.ref_name }}
  # A newer commit on main supersedes a running check; releases always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Pushes to main only build and test; tags and manual runs publish.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    steps:
      - name: Check Docker Hub credentials
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and a write-capable DOCKERHUB_TOKEN in codevideo-cli repository Actions secrets. API repository secrets are separate."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select committed release source
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ "$PUBLISH" != true ]; then
            # main: test the commit as pushed, under a version no release uses.
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-main.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a release tag such as v0.0.8'; exit 1; }
          git checkout --detach "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + version)
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: fullstackcraft/codevideo-cli
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}

      - name: Set up QEMU (arm64 emulation)
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite an existing release image
        if: env.PUBLISH == 'true'
        env:
          IMAGE: fullstackcraft/codevideo-cli:${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" 2>manifest-error.txt; then
            echo "::error::Release image already exists; verify its source and use it. Never overwrite a release."
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest|not found' manifest-error.txt; then
            cat manifest-error.txt >&2
            echo '::error::Cannot establish image absence. Check repository access before publishing.'
            exit 1
          fi

      # ci.yml already runs the tests for every push to main; repeat them only
      # as the gate before publishing a release.
      - uses: actions/setup-go@v6
        if: env.PUBLISH == 'true'
        with:
          go-version-file: go.mod
      - if: env.PUBLISH == 'true'
        run: go test ./...

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: codevideo-cli:smoke
          build-args: VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test worker with an isolated empty queue
        run: |
          docker run --rm codevideo-cli:smoke --version
          trap 'docker logs --tail=60 codevideo-worker-smoke; docker rm -f codevideo-worker-smoke' EXIT
          docker run -d --name codevideo-worker-smoke --network none -e CODEVIDEO_WORK_DIR=/tmp/smoke-queue codevideo-cli:smoke
          for attempt in {1..30}; do
            if docker logs codevideo-worker-smoke 2>&1 | grep -q 'Watching for new manifest files'; then
              sleep 5
              test "$(docker inspect -f '{{.State.Running}}' codevideo-worker-smoke)" = true
              docker exec codevideo-worker-smoke sh -ec 'test -d /tmp/smoke-queue/new && test -w /tmp/smoke-queue/new'
              exit 0
            fi
            sleep 2
          done
          exit 1

      # The empty-queue check above never launches Chromium, so a recorder that
      # cannot start (0.0.8/0.0.9: Chromium 124 lacked Extensions.loadUnpacked)
      # still passed. Render narration-free manifests for real and require each
      # mp4: one landscape, and one portrait job that sets its own orientation the
      # way API requests do. Networking stays on because the page loads Monaco from
      # its CDN; the container has no S3, Clerk or mail credentials, so each job
      # stops at the upload step and touches nothing outside the runner.
      - name: Smoke-test realtime renders
        run: |
          trap 'docker logs --tail=80 codevideo-render-smoke 2>&1 | grep -vE "bus\.cc|dbus|ffmpeg output"; docker rm -f codevideo-render-smoke' EXIT
          docker run -d --name codevideo-render-smoke -e CODEVIDEO_WORK_DIR=/tmp/smoke-queue codevideo-cli:smoke
          for attempt in {1..30}; do
            docker logs codevideo-render-smoke 2>&1 | grep -q 'Watching for new manifest files' && break
            sleep 2
          done
          actions='[{"name":"file-explorer-create-file","value":"index.js"},{"name":"file-explorer-open-file","value":"index.js"},{"name":"editor-type","value":"console.log(1 + 1);"}]'
          # Queue the manifest on stdin as job $1 and require an mp4 of size $2
          # that lasts over a second.
          smoke_render() {
            docker exec -i codevideo-render-smoke sh -ec "mkdir -p /tmp/smoke-queue/new && cat > /tmp/smoke-queue/new/.$1.tmp && mv /tmp/smoke-queue/new/.$1.tmp /tmp/smoke-queue/new/$1.json"
            for attempt in {1..90}; do
              logs=$(docker logs codevideo-render-smoke 2>&1)
              if grep -q "Converted webm to mp4 for job $1" <<<"$logs"; then
                mp4=/tmp/smoke-queue/video/$1.mp4
                size=$(docker exec codevideo-render-smoke ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$mp4")
                duration=$(docker exec codevideo-render-smoke ffprobe -v error -show_entries format=duration -of csv=p=0 "$mp4")
                echo "$1: ${size}, ${duration}s"
                [ "$size" = "$2" ] || { echo "::error::$1 rendered at $size, expected $2"; return 1; }
                awk -v d="$duration" 'BEGIN { exit !(d > 1) }' || { echo "::error::$1 is only ${duration}s long"; return 1; }
                return 0
              fi
              if grep -qE "Puppeteer recording failed|Failed to convert webm" <<<"$logs"; then
                echo "::error::Realtime smoke render $1 failed"
                return 1
              fi
              sleep 2
            done
            echo "::error::Realtime smoke render $1 did not finish within 3 minutes"
            return 1
          }
          smoke_render smoke-render 1920x1080 <<<"{\"environment\":\"staging\",\"userId\":\"smoke-test\",\"uuid\":\"smoke-render\",\"audioItems\":[],\"actions\":$actions}"
          smoke_render smoke-portrait 1080x1920 <<<"{\"environment\":\"staging\",\"userId\":\"smoke-test\",\"uuid\":\"smoke-portrait\",\"videoOptions\":{\"orientation\":\"portrait\"},\"codeVideoIDEProps\":{\"isMouseVisible\":false},\"audioItems\":[],\"actions\":$actions}"

      # The CLI as users run it, on real Chromium: no terminal here, so progress
      # is one plain line per stage and per 25% on stderr, and the saved file is
      # the only line on stdout. No narration: there are no TTS credentials.
      - name: End-to-end CLI renders
        env:
          OUT: ${{ runner.temp }}/cli-renders
        run: |
          mkdir -p "$OUT"
          actions='[{"name":"file-explorer-create-file","value":"index.js"},{"name":"file-explorer-open-file","value":"index.js"},{"name":"editor-type","value":"console.log(1 + 1);"}]'
          # Render $1 with the remaining arguments, then check stdout, stderr
          # (each pattern after --, in order) and the mp4.
          cli_render() {
            local name=$1; shift
            local args=() patterns=()
            while [ $# -gt 0 ] && [ "$1" != -- ]; do args+=("$1"); shift; done
            shift
            patterns=("$@")
            if ! docker run --name "cli-$name" codevideo-cli:smoke -p "$actions" -o "/tmp/cli/$name.mp4" "${args[@]}" >"$OUT/$name.stdout" 2>"$OUT/$name.stderr"; then
              echo "::error::CLI render $name failed"; cat "$OUT/$name.stderr"; docker rm -f "cli-$name" >/dev/null; return 1
            fi
            docker cp "cli-$name:/tmp/cli/$name.mp4" "$OUT/$name.mp4"
            docker cp "cli-$name:/app/codevideo.log" "$OUT/$name.log" || true
            docker rm -f "cli-$name" >/dev/null
            echo "--- $name stderr"; cat "$OUT/$name.stderr"
            grep -qx "✅ CodeVideo successfully generated and saved to /tmp/cli/$name.mp4" "$OUT/$name.stdout" \
              || { echo "::error::$name: unexpected stdout"; cat "$OUT/$name.stdout"; return 1; }
            # Each pattern must match a later stderr line than the one before.
            local line=0
            for pattern in "${patterns[@]}"; do
              found=$(tail -n "+$((line + 1))" "$OUT/$name.stderr" | grep -nE -m1 "$pattern" | cut -d: -f1)
              [ -n "$found" ] || { echo "::error::$name: no stderr line matching '$pattern' after line $line"; return 1; }
              line=$((line + found))
            done
            if grep -qE '^(debug|warning|error): |level=' "$OUT/$name.stderr"; then
              echo "::error::$name: log lines on stderr"; return 1
            fi
            size=$(docker run --rm -v "$OUT:/check:ro" --entrypoint ffprobe codevideo-cli:smoke -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "/check/$name.mp4")
            [ "$size" = 1920x1080 ] || { echo "::error::$name rendered at $size"; return 1; }
          }
          cli_render realtime -- \
            '^Detected project type: Actions$' \
            '^\[ *[0-9]+%\] Starting browser · [0-9]+:[0-9]{2} / [0-9]+:[0-9]{2}$' \
            '^\[ *[0-9]+%\] Recording · action [0-9]+/3 · ' \
            '^\[ *[0-9]+%\] Encoding · ' \
            '^\[100%\] Done · [0-9]+:[0-9]{2}$'
          cli_render deterministic --render-mode deterministic -- \
            '^Detected project type: Actions$' \
            '^\[ *[0-9]+%\] Planning timeline · frame [0-9]+ · ' \
            '^\[ *[0-9]+%\] Rendering frames · frame [0-9]+/[0-9]+ · ' \
            '^\[100%\] Done · [0-9]+:[0-9]{2}$'

      - name: Upload CLI render output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-renders
          path: ${{ runner.temp }}/cli-renders
          if-no-files-found: ignore

      - name: Build and push (linux/amd64 + linux/arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published architectures
        if: env.PUBLISH == 'true'
        env:
          IMAGE: fullstackcraft/codevideo-cli:${{ steps.release.outputs.version }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > manifest.json
          python3 - <<'PYCODE'
          import json
          manifest = json.load(open('manifest.json'))
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PYCODE
